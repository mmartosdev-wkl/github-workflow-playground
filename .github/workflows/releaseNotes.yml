name: Update Release Notes

on:
    pull_request:
        branches:
            - 'dev'
        types: [ 'closed' ]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    update_changelog:
        name: Update Release Notes
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        # Only run if the PR is merged
        if: github.event.pull_request.merged == true

        steps:
            - name: Checkout codebase
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.LOKALISE_PAT }}
                  fetch-depth: 1
                  lfs: false

            - name: Identify current version tag
              id: current_release
              shell: bash
              run: |
                  # Safely extract versionName from gradle.properties
                  CURRENT_VERSION_TAG=$(grep '^versionName=' app/gradle.properties | cut -d'=' -f2)
                  if [ -z "$CURRENT_VERSION_TAG" ]; then
                    echo "Error: Could not find 'versionName' in app/gradle.properties."
                    exit 1
                  fi
                  echo "version_tag=${CURRENT_VERSION_TAG}" >> "$GITHUB_OUTPUT"

            - name: Modify CHANGELOG.md
              uses: actions/github-script@v7
              with:
                  script: |
                      const fs = require('fs');
                      const changelog = require('.github/workflows/releaseNotes/releaseNotes.js')
                      const releaseNotes = await changelog.createReleaseBody({
                        github: github,
                        context: context,
                        tagName: process.env.CURRENT_VERSION_TAG,
                      });
                      git checkout dev
                      fs.writeFileSync("CHANGELOG.md", releaseNotes, 'utf8');

            - name: commit CHANGELOG.md changes
              run: |
                  git config user.email "wikiloctech@gmail.com"
                  git config user.name "wikiloc-forest"
                  git add CHANGELOG.md
                  git commit -m "update CHANGELOG.md" || echo "No changes to commit."                      

            - name: Create release draft with proper changelog
              uses: actions/github-script@v7
              with:
                  script: |
                      const changelog = require('.github/workflows/releaseNotes/releaseNotes.js')
                      await changelog.createRelease({
                        github: github,
                        context: context,
                        tagName: process.env.CURRENT_VERSION_TAG,
                        isDraft: true,
                      });
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  CURRENT_VERSION_TAG: ${{ steps.current_release.outputs.version_tag }}
