name: On-demand Workflow

on:
    workflow_dispatch:
        inputs:
            gradle_tasks:
                description: 'Array with lists of tasks to run'
                required: false

jobs:
    onDemandRunner:
        name: Run requested gradle tasks
        runs-on: ubuntu-latest
        concurrency:
            group: compilationCheck-${{ github.workflow }}-${{ github.base_ref }}
            cancel-in-progress: true

        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-tags: false
                    lfs: true

            -   name: set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Build with Gradle
                run: |
                    echo '${{ inputs.gradle_tasks }}' | jq -c '.[]' | while read -r tasks; do
                        ./gradlew $(echo $tasks | jq -r '.[]') --scan
                    done

