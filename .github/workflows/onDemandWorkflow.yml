name: On-demand Workflow

on:
    workflow_dispatch:
        inputs:
            gradle_tasks:
                description: 'Array with lists of tasks to run'
                required: false

jobs:
    onDemandRunner:
        name: Run requested gradle tasks
        runs-on: ubuntu-latest
        concurrency:
            group: compilationCheck-${{ github.workflow }}-${{ github.base_ref }}
            cancel-in-progress: true

        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-tags: false
                    lfs: true

            -   name: set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4
                with:
                    cache-read-only: false
                    gradle-home-cache-cleanup: true

            -   name: Build with Gradle
                uses: actions/github-script@v7
                with:
                    script: |
                        await exec.exec('echo inputs');
                        await exec.exec('echo', core.getInput('gradle_tasks'));
                        core.info(core.getInput('gradle_tasks'));
#                        const gradleTasks = JSON.parse(core.getInput('gradle_tasks'));
#                        for (const tasks of gradleTasks) {
#                            core.info(tasks);
#                        }
