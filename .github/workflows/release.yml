name: Release Preparation

on:
    workflow_dispatch:
        inputs:
            version_tag:
                description: 'New version tag (e.g.: 3.45.2). Leave empty for auto-increment.'
                required: false
    pull_request:
        branches:
            - 'release_*'
        types: [ 'closed' ]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    release:
        name: Release Preparation
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        if: |
            (
              github.event_name == 'pull_request' &&
              github.event.action == 'closed' &&
              github.event.pull_request.merged == true &&
              startsWith(github.event.pull_request.base.ref, 'release_')
            )
            || github.event_name == 'workflow_dispatch'

        steps:
            - name: Validate input version
              run: |
                  VERSION="${{ inputs.version_tag }}"
                  if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "$VERSION" ] && [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
                    echo "Error: '$VERSION' is not a valid semantic version (expected format: MAJOR.MINOR.PATCH)."
                    exit 1
                  fi

            - name: Setup base branch
              id: base_branch
              run: |
                  if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
                    echo "base_branch=${{ github.event.pull_request.base.ref }}" >> "$GITHUB_OUTPUT"
                  else
                    echo "base_branch=dev" >> "$GITHUB_OUTPUT"
                  fi

            - name: Checkout codebase
              uses: actions/checkout@v4
              with:
                  token: ${{ secrets.LOKALISE_PAT }}
                  ref: ${{ steps.base_branch.outputs.base_branch }}
                  fetch-depth: 1
                  lfs: false

            - name: Determine version tag
              id: version_tag
              env:
                  GITHUB_REF_NAME: ${{ github.ref_name }}
              run: |
                  CURRENT_VERSION_TAG=$(grep '^versionName=' app/gradle.properties | cut -d'=' -f2)
                  if [ -z "$CURRENT_VERSION_TAG" ]; then
                    echo "Error: Could not find 'versionName' in app/gradle.properties."
                    exit 1
                  fi

                  # Pull Request merged
                  if [ "${{ github.event_name }}" == "pull_request" ] && [ "${{ github.event.pull_request.merged }}" == "true" ]; then
                    # If the merged PR's base is not dev, bump patch version
                    if [ "$GITHUB_REF_NAME" != "dev" ]; then
                      IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION_TAG}"
                      NEW_PATCH=$((PATCH + 1))
                      NEW_VERSION_TAG="$MAJOR.$MINOR.$NEW_PATCH"
                      echo "version_tag=${NEW_VERSION_TAG}" >> "$GITHUB_OUTPUT"
                      echo "old_version_tag=${CURRENT_VERSION_TAG}" >> "$GITHUB_OUTPUT"
                    else
                      echo "version_tag=${CURRENT_VERSION_TAG}" >> "$GITHUB_OUTPUT"
                    fi

                  # Manual dispatch
                  elif [ "${{ github.event_name }}" == "workflow_dispatch" ] && [ -n "${{ inputs.version_tag }}" ]; then
                    echo "version_tag=${{ inputs.version_tag }}" >> "$GITHUB_OUTPUT"

                  # Fallback to current version
                  else
                    echo "version_tag=${CURRENT_VERSION_TAG}" >> "$GITHUB_OUTPUT"
                  fi

            - name: Create or switch to release branch
              id: create_branch
              run: |
                  VERSION_TAG="${{ steps.version_tag.outputs.version_tag }}"
                  NEW_BRANCH="release_$(echo "$VERSION_TAG" | awk -F. '{print $1 "." $2}')"
                  echo "new_branch=${NEW_BRANCH}" >> "$GITHUB_OUTPUT"

                  if git ls-remote --heads origin "$NEW_BRANCH" | grep -q "refs/heads/$NEW_BRANCH"; then
                    git checkout "$NEW_BRANCH"
                  else
                    git checkout -b "$NEW_BRANCH"
                  fi

            - name: Bump version (only in release branch)
              id: bump_version
              env:
                  GITHUB_REF_NAME: ${{ github.ref_name }}
              run: |
                  VERSION_TAG="${{ steps.version_tag.outputs.version_tag }}"
                  VERSION_CODE=$(grep '^versionCode=' app/gradle.properties | cut -d'=' -f2)

                  # Only bump if the current ref is NOT dev
                  if [ "$GITHUB_REF_NAME" != "dev" ]; then
                    NEW_VERSION_CODE=$((VERSION_CODE + 1))
                    sed -i "s/^versionName=.*/versionName=${VERSION_TAG}/" app/gradle.properties
                    sed -i "s/^versionCode=.*/versionCode=${NEW_VERSION_CODE}/" app/gradle.properties
                    echo "version_code=${NEW_VERSION_CODE}" >> "$GITHUB_OUTPUT"
                  else
                    echo "version_code=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
                  fi

