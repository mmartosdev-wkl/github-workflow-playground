name: Changelog

on:
    pull_request:
        branches:
            - 'dev'
        types: [ 'closed' ]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    update_changelog:
        name: Update changelog
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        if: github.event.pull_request.merged == true
        steps:
            -   name: Checkout codebase
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Identify current version tag
                id: current_release
                run: |
                    CURRENT_VERSION_TAG=$(grep '^versionName=' app/gradle.properties | cut -d'=' -f2)
                    echo "version_tag=${CURRENT_VERSION_TAG}" >> $GITHUB_OUTPUT

            -   name: Unified
                id: unified
                uses: actions/github-script@v7
                with:
                    script: |
                        const changelog = require('.github/workflows/changelog/changelog.js')
                        await changelog.changelog({
                            github: github,
                            context: context,
                            tagName: process.env.CURRENT_VERSION_TAG,
                        });
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                    CURRENT_VERSION_TAG: ${{ steps.current_release.outputs.version_tag }}
