name: Changelog

on:
    pull_request:
        branches:
            - 'dev'
        types: [ 'closed' ]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    update_changelog:
        name: Update changelog
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout codebase
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Identify last release cut
                uses: actions/github-script@v7
                with:
                    script: |
                        const { data: releases } = await.github.repos.listReleases({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                        }};
                        
                        // Filter releases for those with a version tag where patch = 0
                        const filteredReleases = releases.filter(release => {
                            const match = release.tag_name.match(/^v\d+\.\d+\.0$/);
                            return match !== null;
                        });
                        
                        if (filteredReleases.length !== 0) {
                            filteredReleases.forEach((release) => console.log(release));
                        } else {
                            core.setFailed("No releases with patch version 0 found.");
                        }




