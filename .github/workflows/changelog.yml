name: Changelog

on:
    pull_request:
        branches:
            - 'dev'
        types: [ 'closed' ]

concurrency:
    group: ${{ github.workflow }}
    cancel-in-progress: true

jobs:
    update_changelog:
        name: Update changelog
        permissions:
            contents: write
            pull-requests: write
        runs-on: ubuntu-latest
        steps:
            -   name: Checkout codebase
                uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            -   name: Identify last release cut
                uses: actions/github-script@v7
                if: github.event.pull_request.merged == true
                with:
                    script: |
                        // Retrieve all releases
                        console.log("github -> " + github);
                        console.log("github.rateLimit -> " + github.rateLimit);
                        console.log("context.repo -> " + context.repo);
                        console.log("github.repos -> " + github.repos);
                        const rateLimit = await github.rateLimit.get();
                        console.log("rateLimit -> " + rateLimit.data);
                        const { data: releases } = await github.repos.listReleases({
                            owner: context.repo.owner,
                            repo: context.repo.repo,
                        });
                
                        // Filter releases for those with a version tag where the patch number = 0 (e.g., v1.2.0)
                        const filteredReleases = releases.filter(release => {
                            const match = release.tag_name.match(/^v\d+\.\d+\.0$/);
                            return match !== null;
                        });
                
                        // If there's at least one matching release, log them; otherwise fail
                        if (filteredReleases.length !== 0) {
                            filteredReleases.forEach(release => console.log(release));
                        } else {
                            core.setFailed("No releases with patch version 0 found.");
                        }
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}