name: Record Screenshots Workflow

on:
    issue_comment:
        types: [created]

jobs:
    compilationCheck:
        name: Compilation Check (on-demand)
        runs-on: ubuntu-latest
        if: |
            github.event.issue.pull_request && 
            (startsWith(github.event.comment.body, 'runChecks') || github.event.comment.body == 'runChecks') && 
            contains(github.event.comment.body, 'compile')
        permissions:
            pull-requests: write

        steps:
            -   name: Delete triggering comment
                continue-on-error: true
                uses: actions/github-script@v7
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        const commentId = context.payload.comment.id;
                        
                        core.info(`Deleting comment ${commentId} in ${owner}/${repo}`);
                        await github.rest.issues.deleteComment({
                            owner,
                            repo,
                            comment_id: commentId
                        });

            -   uses: actions/checkout@v4
                with:
                    lfs: true

            -   name: set up JDK 11
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Build with Gradle
                run: echo "Build with gradle"

    codeAnalysis:
        name: Static Code Analysis (on-demand)
        runs-on: ubuntu-latest
        if: |
            github.event.issue.pull_request && 
            (startsWith(github.event.comment.body, 'runChecks') || github.event.comment.body == 'runChecks') && 
            contains(github.event.comment.body, 'detekt') 

        permissions:
            pull-requests: write

        steps:
            -   name: Delete triggering comment
                continue-on-error: true
                uses: actions/github-script@v7
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        const commentId = context.payload.comment.id;
                        
                        core.info(`Deleting comment ${commentId} in ${owner}/${repo}`);
                        await github.rest.issues.deleteComment({
                            owner,
                            repo,
                            comment_id: commentId
                        });

            -   uses: actions/checkout@v4
                with:
                    lfs: true

            -   name: set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Run detekt analysis
                run: echo "Run detekt analysis"

    unitTests:
        name: Run Unit Tests (on-demand)
        runs-on: ubuntu-latest
        if: |
            github.event.issue.pull_request && 
            (startsWith(github.event.comment.body, 'runChecks') || github.event.comment.body == 'runChecks') && 
            (contains(github.event.comment.body, 'unitTests') || contains(github.event.comment.body, 'screenshots')) 

        permissions:
            pull-requests: write

        steps:
            -   name: Delete triggering comment
                continue-on-error: true
                uses: actions/github-script@v7
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        const commentId = context.payload.comment.id;
                        
                        core.info(`Deleting comment ${commentId} in ${owner}/${repo}`);
                        await github.rest.issues.deleteComment({
                            owner,
                            repo,
                            comment_id: commentId
                        });

            -   uses: actions/checkout@v4
                with:
                    lfs: true

            -   name: set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Execute unit tests
                if: contains(github.event.comment.body, 'unitTests')
                continue-on-error: true
                run: |
                    echo "Execute unit tests"
                    echo "failed_task=" >> $GITHUB_OUTPUT
                    echo "report_path=" >> $GITHUB_OUTPUT

            -   name: Report unit test failure
                if: steps.unit_tests.outputs.report_path != ''
                uses: actions/upload-artifact@v4
                with:
                    name: unit-test-report
                    path: ${{ steps.unit_tests.outputs.report_path }}

            -   name: Fail job on test failure
                if: steps.unit_tests.outputs.failed_task != ''
                run: |
                    echo "Unit test failed for task: ${{ steps.unit_tests.outputs.failed_task }}" >> $GITHUB_STEP_SUMMARY
                    exit 1

            -   name: Execute screenshot tests
                if: contains(github.event.comment.body, 'screenshots')
                id: screenshot_tests
                continue-on-error: true
                run: |
                    echo "Execute screenshot tests"
                    echo "failed_task=" >> $GITHUB_OUTPUT
                    echo "report_path=" >> $GITHUB_OUTPUT

            -   name: Report screenshot test failure
                if: steps.screenshot_tests.outputs.report_path != ''
                uses: actions/upload-artifact@v4
                with:
                    name: unit-test-report
                    path: ${{ steps.screenshot_tests.outputs.report_path }}

            -   name: Fail job on test failure
                if: steps.screenshot_tests.outputs.failed_task != ''
                run: |
                    echo "Screenshot test failed for task: ${{ steps.screenshot_tests.outputs.failed_task }}" >> $GITHUB_STEP_SUMMARY
                    exit 1

    record-screenshots:
        name: Record Screenshots
        if: ${{ github.event.issue.pull_request && github.event.comment.body == 'recordScreenshots' }}
        runs-on: ubuntu-latest

        permissions:
            pull-requests: write
            contents: write

        steps:
            -   name: Delete triggering comment
                uses: actions/github-script@v7
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        const commentId = context.payload.comment.id;
                        
                        core.info(`Deleting comment ${commentId} in ${owner}/${repo}`);
                        await github.rest.issues.deleteComment({
                            owner,
                            repo,
                            comment_id: commentId
                        });

            -   name: Get branch name
                id: branch
                uses: actions/github-script@v7
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        const prNumber = context.issue.number;
                        
                        const { data: pr } = await github.rest.pulls.get({
                          owner,
                          repo,
                          pull_number: prNumber
                        });
                        
                        core.setOutput('ref', pr.head.ref);

            -   name: Checkout the code
                uses: actions/checkout@v4
                with:
                    ref: ${{ steps.branch.outputs.ref }}
                    lfs: true

            -   name: set up JDK 17
                uses: actions/setup-java@v4
                with:
                    java-version: '17'
                    distribution: 'temurin'

            -   name: Setup Gradle
                uses: gradle/actions/setup-gradle@v4

            -   name: Record Screenshot Tests
                run: ./gradlew recordScreenshotTests --parallel --scan

            -   name: Commit and push updated screenshots
                run: |
                    git config --local user.email "wikiloctech@gmail.com"
                    git config --local user.name "wikiloc-forest"
                    git add app/src/test/snapshots/**
                    git commit -m "Update screenshots from PR comment trigger" || echo "No changes to commit"
                    git push origin "${{ steps.branch.outputs.ref }}"
                env:
                    GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            -   name: Add comment to PR
                uses: actions/github-script@v7
                with:
                    script: |
                        const { owner, repo } = context.repo;
                        github.rest.issues.createComment({
                            issue_number: context.issue.number,
                            owner: owner,
                            repo: repo,
                            body: '✅ Screenshots have been recorded and committed to the PR'
                        })