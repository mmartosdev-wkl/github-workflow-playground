name: Comment-based workflow

on:
    issue_comment:
        types: [created]

# Minimal permissions the job needs
permissions:
    issues: write          # delete the comment
    pull-requests: read    # read PR metadata
    contents: write        # push screenshots back to branch

jobs:
    handle-comment:
        # Only run if the comment was left on a PR, not on a regular issue
        if: github.event.issue.pull_request
        runs-on: ubuntu-latest

        steps:
            # 1️⃣  check out the PR branch so we can commit back to it
            - name: Check out repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0       # we need full history to push

            # 2️⃣  set up Node 18 with automatic npm cache
            - name: Set up Node.js 18
              uses: actions/setup-node@v4
              with:
                  node-version: 18
                  cache: npm

            # 3️⃣  delete the triggering comment
            - name: Delete triggering comment
              uses: actions/github-script@v7
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const commentId = context.payload.comment.id;
                      
                      core.info(`Deleting comment ${commentId} in ${owner}/${repo}`);
                      await github.rest.issues.deleteComment({
                        owner,
                        repo,
                        comment_id: commentId
                      });

            # 4️⃣  capture the head branch of the PR so we can push to it later
            - name: Get PR head branch
              id: pr
              uses: actions/github-script@v7
              with:
                  script: |
                      const { owner, repo } = context.repo;
                      const prNumber = context.issue.number;
                      
                      const { data: pr } = await github.rest.pulls.get({
                        owner,
                        repo,
                        pull_number: prNumber
                      });
                      
                      core.setOutput('branch', pr.head.ref);   // e.g. "feature/foo"

            # 5️⃣  generate screenshots (replace with your real command),
            #      commit, and push them to the PR branch
            - name: Commit and push updated screenshots
              run: |
                  echo $BRANCH
              env:
                  BRANCH: ${{ steps.pr.outputs.branch }}
